title: Loan application precheck workflow
domain_hint: 여신
requester:
  team: loan-platform
  role: development-leader
known_systems:
  - core_system
  - customer_account_system
  - banking_policy_repository
  - banking_rule_registry
  - banking_template_registry
expected_output: precheck result, missing documents, approval requirement, reviewer notes, and customer follow-up template variables
raw_text: |
  개인사업자 운전자금 대출 신청이 들어오면 신청서, 사업자등록증, 소득 증빙,
  계좌 거래 내역 PDF를 함께 검토하는 사전 심사 흐름이 필요합니다.
  제출 문서는 공통 문서 intake workflow를 사용해서 OCR과 문서 context를 만들고,
  고객 식별자가 있으면 코어 시스템에서 기존 여신, 연체, 최근 심사 이력을
  read-only SQL로 조회해야 합니다.

  동시에 고객/계좌 요약도 조회하고, 여신 정책 문서와 사전 심사 rule set을 찾아서
  필수 서류 누락, 금액/기간 조건, 보완 요청 필요 여부를 판단해야 합니다.
  서류 검토 Agent는 누락 서류와 불일치 항목을 정리하고, 리스크 판단 Agent는
  사람 승인 필요성과 검토자 메모를 설명해야 합니다. 보완이 필요하면 등록된
  템플릿에서 고객 안내 문구를 가져와야 합니다.

  다만 매출 변동성 분석은 아직 catalog에 없으므로 새 Tool 자산 후보로 제안할지 검토하고
  싶습니다. 실제 승인/거절 자동 결정과 거래 write는 이번 범위에서 제외합니다.
