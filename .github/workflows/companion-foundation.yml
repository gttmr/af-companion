name: Companion foundation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  companion-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/companion/package-lock.json

      - name: Install Companion dependencies
        working-directory: packages/companion
        run: npm ci

      - name: Typecheck Companion
        working-directory: packages/companion
        run: npm run typecheck

      - name: Test Companion
        working-directory: packages/companion
        run: npm run test

      - name: Build Companion
        working-directory: packages/companion
        run: npm run build

      - name: Validate shared artifacts
        run: node scripts/validate-artifacts.mjs
